<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 40px 20px; background: #0d1321; color: #e8e6e3;">

  <div style="text-align: center; margin-bottom: 32px;">
    <img src="https://discipleship-tracker-ten.vercel.app/gbm-horizontal-lockup-white.png" alt="Grace Bible Maui" style="height: 60px; width: auto;" />
  </div>

  <h1 style="font-size: 24px; font-weight: 600; color: #ffffff; margin: 0 0 16px 0; text-align: center;">
    Welcome to Constellations
  </h1>

  <p style="font-size: 16px; line-height: 1.6; color: #a8a5a0; margin: 0 0 24px 0; text-align: center;">
    You're one step away from your discipleship journey. Enter this code in the app to verify your email:
  </p>

  <div style="text-align: center; margin: 32px 0;">
    <div style="display: inline-block; background: #161d31; border: 1px solid #2a3350; border-radius: 12px; padding: 18px 28px; font-size: 34px; font-weight: 700; letter-spacing: 10px; color: #ffffff;">
      {{ .Token }}
    </div>
    <p style="font-size: 13px; color: #6b6966; margin: 12px 0 0 0;">This code expires in 1 hour.</p>
  </div>

  <p style="font-size: 14px; line-height: 1.5; color: #a8a5a0; margin: 24px 0 0 0; text-align: center;">
    On the web? You can also
    <a href="{{ .ConfirmationURL }}" style="color: #5b8df7; text-decoration: none;">confirm your email here</a>.
  </p>

  <p style="font-size: 14px; line-height: 1.5; color: #6b6966; margin: 24px 0 0 0; text-align: center;">
    If you didn't sign up for Constellations, you can ignore this email.
  </p>

</div>
